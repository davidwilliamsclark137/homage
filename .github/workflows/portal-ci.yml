name: Homage portal CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Clean checkout, tests and phone bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Rebuild engine and map from committed inputs
        run: npm run build:assets
      - name: Ensure generated assets match the checkpoint
        run: git diff --exit-code -- vendor/engine/dist features/mckinney/map/embedded.json features/mckinney/map/THREE-LICENSE.txt
      - name: Run automated checks (isolated shared-session storage)
        run: npm run check
      - name: Bundle iOS and Android for release
        run: npm run bundle:phones
      - name: Save validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-validation-${{ github.sha }}
          path: tmp/checks/*.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Save phone bundles
        uses: actions/upload-artifact@v4
        with:
          name: phone-bundles-${{ github.sha }}
          path: app/dist/phones
          if-no-files-found: error
          retention-days: 7
